<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    color-scheme: light dark;
    --ink: #172033;
    --muted: #5d6a82;
    --line: rgba(255, 255, 255, .82);
    --glass: rgba(255, 255, 255, .68);
    --glass-strong: rgba(255, 255, 255, .84);
    --surface: rgba(255, 255, 255, .42);
    --shadow: 0 24px 70px rgba(63, 80, 132, .18), 0 2px 8px rgba(77, 91, 131, .08);
    --blue: #2878ff;
    --purple: #7b55f7;
    --radius-xl: 34px;
    --radius-lg: 26px;
    --radius-md: 20px;
}

html {
    min-height: 100%;
    background: #e8efff;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    padding: 28px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    background:
        radial-gradient(circle at 8% 2%, rgba(103, 172, 255, .54), transparent 30%),
        radial-gradient(circle at 94% 8%, rgba(173, 137, 239, .50), transparent 31%),
        radial-gradient(circle at 52% 100%, rgba(120, 211, 205, .30), transparent 38%),
        linear-gradient(135deg, #edf3fb 0%, #f8f6fc 48%, #f1faf9 100%);
}

body::before,
body::after {
    position: fixed;
    z-index: -1;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    content: "";
    filter: blur(60px);
    opacity: .26;
    pointer-events: none;
}

body::before {
    top: 25%;
    left: -170px;
    background: #7cb5ff;
}

body::after {
    right: -150px;
    bottom: 4%;
    background: #c89bea;
}

.topbar,
.hero,
.card,
.side-card,
.notice {
    border: 1px solid var(--line);
    background: var(--glass);
    box-shadow: var(--shadow);
    backdrop-filter: blur(28px) saturate(145%);
    -webkit-backdrop-filter: blur(28px) saturate(145%);
}

/* Content uses a thicker standard material; glass stays reserved for the shell. */
.hero,
.card,
.notice {
    background: var(--glass-strong);
    backdrop-filter: blur(20px) saturate(125%);
    -webkit-backdrop-filter: blur(20px) saturate(125%);
}

.topbar {
    display: flex;
    align-items: center;
    max-width: 1440px;
    margin: 0 auto 24px;
    padding: 16px 20px;
    border-radius: 24px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo-icon {
    display: grid;
    width: 48px;
    height: 48px;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .82);
    border-radius: 17px;
    color: #fff;
    font-size: 24px;
    background: linear-gradient(145deg, #4a9df1, #6964dc 72%, #9b70dc);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .8), 0 12px 24px rgba(77, 101, 225, .28);
}

.logo-text {
    color: var(--ink);
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -.02em;
}

.logo-text span::after {
    color: var(--muted);
    content: "Clash";
}

.container {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    gap: 24px;
    max-width: 1440px;
    margin: 0 auto;
}

.hero {
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
    padding: clamp(32px, 6vw, 72px) 28px 34px;
    border-radius: var(--radius-xl);
    text-align: center;
}

.hero::after {
    position: absolute;
    right: -70px;
    bottom: -120px;
    width: 300px;
    height: 250px;
    border-radius: 50%;
    background: rgba(111, 167, 255, .22);
    content: "";
    filter: blur(30px);
}

.hero h1 {
    position: relative;
    z-index: 1;
    margin-bottom: 14px;
    color: var(--ink);
    font-size: clamp(42px, 7vw, 78px);
    font-weight: 780;
    letter-spacing: -.065em;
    line-height: .98;
}

.hero h1 span {
    color: transparent;
    background: linear-gradient(100deg, #216fe8, #765ed6 62%, #a56acb);
    -webkit-background-clip: text;
    background-clip: text;
}

.hero p {
    position: relative;
    z-index: 1;
    color: var(--muted);
    font-size: 17px;
    letter-spacing: -.01em;
}

.system {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 25px auto 0;
    padding: 10px 16px;
    border: 1px solid rgba(91, 126, 219, .18);
    border-radius: 999px;
    color: #2864c9;
    font-size: 13px;
    font-weight: 650;
    background: rgba(236, 243, 255, .78);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .8);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.card {
    position: relative;
    overflow: hidden;
    padding: 22px;
    border-radius: var(--radius-lg);
    text-align: center;
    transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
}

.card::before {
    position: absolute;
    top: 0;
    right: 18%;
    left: 18%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
    content: "";
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 28px 70px rgba(63, 80, 132, .22), 0 2px 8px rgba(77, 91, 131, .08);
}

.icon {
    display: grid;
    width: 58px;
    height: 58px;
    margin: 0 auto 16px;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .78);
    border-radius: 20px;
    font-size: 28px;
    background: linear-gradient(145deg, rgba(255, 255, 255, .88), rgba(229, 237, 252, .60));
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), 0 10px 20px rgba(99, 119, 180, .12);
}

.card-title {
    margin-bottom: 6px;
    color: var(--ink);
    font-size: 21px;
    font-weight: 750;
    letter-spacing: -.035em;
}

.card-desc {
    margin-bottom: 17px;
    color: var(--muted);
    font-size: 12px;
}

.btn {
    width: 100%;
    margin-bottom: 9px;
    padding: 12px 14px;
    border: 0;
    border-radius: 14px;
    color: #fff;
    background-image: linear-gradient(135deg, rgba(255, 255, 255, .16), rgba(0, 0, 0, .08));
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .36), 0 9px 18px rgba(71, 102, 187, .16);
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
}

.btn:hover {
    filter: saturate(1.12) brightness(1.04);
    transform: translateY(-1px);
}

.btn:active {
    transform: scale(.98);
}

.btn:focus-visible {
    outline: 3px solid rgba(45, 119, 255, .28);
    outline-offset: 3px;
}

.copy {
    margin-bottom: 0;
    border: 1px solid rgba(125, 143, 180, .16);
    color: #41506b;
    background: rgba(247, 249, 255, .76);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9);
}

.copy:hover {
    background: rgba(255, 255, 255, .86);
}

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.side-card {
    padding: 22px;
    border-radius: var(--radius-lg);
}

.side-title {
    margin-bottom: 18px;
    color: var(--ink);
    font-size: 20px;
    font-weight: 750;
    letter-spacing: -.035em;
}

.contact {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    padding: 12px;

    border-radius: 18px;
    background: rgba(255, 255, 255, .34);

.contact:last-child {

.contact-icon {

/*
====================================
真正兼容 iPhone 的系统识别
====================================
*/

function detectSystem(){

    const ua =
    navigator.userAgent;

    // iPhone / iPad

    if(

        /iPhone|iPad|iPod/i.test(ua)

        ||

        (
            navigator.platform === 'MacIntel'

            &&

            navigator.maxTouchPoints > 1
        )

    ){

        return "📱 iPhone / iPad";
    }

    // Android

    if(/Android/i.test(ua)){

        return "🤖 Android";
    }

    // Windows

    if(/Windows/i.test(ua)){

        return "🖥 Windows";
    }

    // macOS

    if(/Macintosh|Mac OS X/i.test(ua)){

        return "🍎 macOS";
    }

    return "🌐 Unknown";
}

document.getElementById("system")
.innerText =
"当前系统：" + detectSystem();

/*
====================================
密码验证
====================================
*/

function verifyPassword(item){

    const input =
    prompt("请输入该线路密码");

    if(input !== item.password){

        alert("密码错误");

        return false;
    }

    return true;
}

/*
====================================
生成卡片
====================================
*/

const grid =
document.getElementById("grid");

subscriptions.forEach((item,index)=>{

    const card =
    document.createElement("div");

    card.className = "card";

    card.innerHTML = `

    <div class="icon">
        ${item.icon}
    </div>

    <div class="card-title">
        ${item.name}
    </div>

    <div class="card-desc">
        自动识别系统导入
    </div>

    <button
    class="btn"
    style="background:${item.color}"
    onclick="importSub(${index})">

        🚀 一键导入

    </button>

    <button
    class="btn copy"
    onclick="copySub(${index})">

        📋 复制链接

    </button>

    `;

    grid.appendChild(card);
});

/*
====================================
自动识别系统导入
====================================
*/

function importSub(index){

    const item =
    subscriptions[index];

    if(!verifyPassword(item)){

        return;
    }

    const scheme =
        "clashmi://install-config?name=" +
        encodeURIComponent("徐胖虎资源社") +
        "&url=" +
        encodeURIComponent(item.url);

    window.location.href =
    scheme;
}

/*
====================================
复制
====================================
*/

async function copySub(index){

    const item =
    subscriptions[index];

    if(!verifyPassword(item)){

        return;
    }

    try{

        await navigator.clipboard
        .writeText(item.url);

        alert("订阅链接已复制");

    }catch(e){

        alert("复制失败");
    }
}
