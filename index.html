<style>
* {
    box-sizing: border-box;
    margin: 0;

:root {
    color-scheme: light dark;
    --bg: #f6f7fa;
    --panel: #ffffff;

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    padding: 28px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;

}

.topbar,
.container {
    width: min(1180px, 100%);
    margin-right: auto;
    margin-left: auto;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 46px;
    padding: 0 0 18px;
    border-bottom: 1px solid var(--line);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    display: grid;
    width: 36px;
    height: 36px;
    place-items: center;
    border-radius: 11px;
    color: #fff;
    background: var(--ink);
}

.logo-icon svg {
    width: 20px;
    height: 20px;
}

.logo-text {
    color: var(--ink);
    font-size: 17px;
    font-weight: 750;
    letter-spacing: -.025em;
}

.logo-text span::after {
    content: "Clash";
}

.topbar::after {
    color: var(--subtle);
    content: "PRIVATE SUBSCRIPTION HUB";
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .16em;
}

.container {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 270px;
    gap: 62px;
}

.hero {
    margin-bottom: 34px;
}

.hero::before {
    display: block;
    width: 34px;
    height: 3px;
    margin-bottom: 24px;
    border-radius: 3px;
    background: var(--accent);
    content: "";
}

.hero h1 {
    max-width: 720px;
    margin-bottom: 16px;
    color: var(--ink);
    font-size: clamp(42px, 6vw, 68px);
    font-weight: 780;
    letter-spacing: -.075em;
    line-height: .98;
}

.hero h1 span {
    color: var(--accent);
}

.hero p {
    max-width: 560px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
}

.system {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 8px 12px;
    border: 1px solid #dbe4fb;
    border-radius: 999px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    background: var(--accent-soft);
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}

.card {
    position: relative;
    min-height: 220px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--panel);
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}

.card:hover {
    border-color: #c6d2ef;
    box-shadow: 0 22px 52px rgba(20, 31, 56, .11);
    transform: translateY(-3px);
}

.icon {
    display: grid;
    width: 42px;
    height: 42px;
    margin-bottom: 28px;
    place-items: center;
    border: 1px solid #dce5fb;
    border-radius: 13px;
    color: var(--accent);
    background: var(--accent-soft);
}

.icon svg {
    width: 21px;
    height: 21px;
    stroke: currentColor;
}

.card-title {
    margin-bottom: 5px;
    color: var(--ink);
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -.035em;
}

.card-desc {
    margin-bottom: 18px;
    color: var(--muted);
    font-size: 11px;

.btn {

    padding: 10px 12px;
    border: 0;
    border-radius: 10px;
    color: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: none;
    transition: filter .2s ease, transform .2s ease;

.btn:hover {

.btn:active {

}

.btn:focus-visible {

真正兼容 iPhone 的系统识别
====================================

function detectSystem(){

    const ua =
    navigator.userAgent;

    // iPhone / iPad

    if(

        /iPhone|iPad|iPod/i.test(ua)

        ||

        (
            navigator.platform === 'MacIntel'

            &&

            navigator.maxTouchPoints > 1
        )

    ){

        return "iPhone / iPad";
    }

    // Android

    if(/Android/i.test(ua)){

        return "Android";
    }

    // Windows

    if(/Windows/i.test(ua)){

        return "Windows";
    }

    // macOS

    if(/Macintosh|Mac OS X/i.test(ua)){

        return "macOS";
    }

    return "Unknown";
}

"当前系统：" + detectSystem();

/*

自动识别系统导入
====================================
*/

function importSub(index){

    const item =
    subscriptions[index];

    if(!verifyPassword(item)){

        return;
    }

    const ua =
    navigator.userAgent;

    let scheme = "";

    if(

        /iPhone|iPad|iPod/i.test(ua)

        ||

        (
            navigator.platform === 'MacIntel'

            &&

            navigator.maxTouchPoints > 1
        )

    ){

        scheme =

        "clash://install-config?url=" +

        encodeURIComponent(item.url);
    }

    else if(/Android/i.test(ua)){

        scheme =

        "clash://install-config?url=" +

        encodeURIComponent(item.url);
    }

    else{

        scheme =

        "clash://install-config?url=" +

        encodeURIComponent(item.url);
    }

    window.location.href =
    scheme;
}

/*
====================================
复制
====================================
*/

async function copySub(index){

    const item =
    subscriptions[index];

    if(!verifyPassword(item)){

        return;
    }

    try{

        await navigator.clipboard
        .writeText(item.url);

        alert("订阅链接已复制");

    }catch(e){

        alert("复制失败");
    }
}
